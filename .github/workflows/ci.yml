name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        run: swift test --enable-code-coverage

      - name: Coverage summary
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          PROFDATA="$BIN_PATH/codecov/default.profdata"
          found=0
          while IFS= read -r bundle; do
            name=$(basename "$bundle" .xctest)
            exe="$bundle/Contents/MacOS/$name"
            if [[ ! -x "$exe" ]]; then
              echo "Skipping $bundle (no executable at $exe)"
              continue
            fi
            found=1
            echo "==> Coverage: $name"
            xcrun llvm-cov report \
              "$exe" \
              -instr-profile "$PROFDATA" \
              Sources Tests
          done < <(find "$BIN_PATH" -type d -name '*.xctest' | sort)
          if [[ "$found" -eq 0 ]]; then
            echo "No test bundles with executables found under $BIN_PATH" >&2
            exit 1
          fi

      - name: Release build
        run: swift build -c release

      - name: Packaging smoke test
        run: bash scripts/test-packaging.sh
