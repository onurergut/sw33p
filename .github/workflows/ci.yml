name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        run: swift test --enable-code-coverage

      - name: Coverage summary
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          xcrun llvm-cov report \
            "$BIN_PATH/sw33pPackageTests.xctest/Contents/MacOS/sw33pPackageTests" \
            -instr-profile "$BIN_PATH/codecov/default.profdata" \
            Sources Tests

      - name: Release build
        run: swift build -c release

      - name: Packaging smoke test
        run: bash scripts/test-packaging.sh
